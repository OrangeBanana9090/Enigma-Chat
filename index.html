<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENIGMA CHAT</title>

<style>
    body {
        background: #111;
        color: #eee;
        font-family: monospace;
        margin: 0;
        padding: 20px;
    }

    .app {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        color: #7cff7c;
    }

    .panel {
        border: 1px solid #555;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        background: #181818;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    td, th {
        border: 1px solid #555;
        padding: 6px;
        text-align: center;
    }

    textarea {
        width: 100%;
        box-sizing: border-box;
        background: #080808;
        color: #7cff7c;
        border: 1px solid #555;
        padding: 10px;
        font-family: monospace;
        resize: vertical;
    }

    button {
        background: #222;
        color: white;
        border: 1px solid #777;
        padding: 10px 15px;
        margin: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .keyboard {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 5px;
        margin-top: 10px;
    }

    .key {
        padding: 12px 3px;
        text-align: center;
        border: 1px solid #555;
        background: #222;
        border-radius: 5px;
        user-select: none;
    }

    .key.active {
        background: #7cff7c;
        color: #000;
    }

    #output {
        white-space: pre-wrap;
        word-break: break-all;
        color: #7cff7c;
    }
</style>
</head>

<body>

<div class="app">

<h1>🔐 ENIGMA CHAT</h1>

<div class="panel">
    <h2>Today's Key</h2>
    <div id="keyTable"></div>
</div>

<div class="panel">
    <h2>Input</h2>

    <textarea id="input"
        rows="4"
        placeholder="TYPE ENGLISH HERE..."></textarea>

    <div class="keyboard" id="keyboard"></div>

    <button onclick="encrypt()">ENCRYPT</button>
    <button onclick="decrypt()">DECRYPT</button>
</div>

<div class="panel">
    <h2>Output</h2>
    <div id="output"></div>
</div>

<div class="panel">
    <button onclick="copyOutput()">COPY</button>
</div>

</div>

<script>

/* =========================
   ENIGMA CONFIG
========================= */

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const rotors = {
    I:   "EKMFLGDQVZNTOWYHXUSPAIBRCJ",
    II:  "AJDKSIRUXBLHWTMCQGZNPYFVOE",
    III: "BDFHJLCPRTXVZNYEIWGAKMUSQO"
};

const reflector = "YRUHQSLDPXNGOKMIEBFZCWVJAT";

let settings;


/* =========================
   DAILY KEY
========================= */

/*
    日本時間の日付を取得
    例:
    2026-08-24
*/

function getJapanDate() {

    return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).format(new Date());

}


/*
    日付から決定論的な乱数を作る

    同じ文字列を入れれば
    PCでもスマホでも同じ結果になる
*/

function seededRandom(seed) {

    let h = 2166136261;

    for (let i = 0; i < seed.length; i++) {

        h ^= seed.charCodeAt(i);

        h = Math.imul(
            h,
            16777619
        );

    }

    return function () {

        h += 0x6D2B79F5;

        let t = h;

        t = Math.imul(
            t ^ (t >>> 15),
            t | 1
        );

        t ^= t + Math.imul(
            t ^ (t >>> 7),
            t | 61
        );

        return (
            (t ^ (t >>> 14)) >>> 0
        ) / 4294967296;

    };

}


/*
    今日の鍵を生成
*/

function generateDailyKey() {

    const date = getJapanDate();

    const random =
        seededRandom(
            "ENIGMA-CHAT-" + date
        );


    /*
        ローター順
    */

    const rotorNames = [
        "I",
        "II",
        "III"
    ];

    const order = [
        ...rotorNames
    ];


    /*
        Fisher-Yates shuffle
    */

    for (
        let i = order.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                random() * (i + 1)
            );

        [
            order[i],
            order[j]
        ] = [
            order[j],
            order[i]
        ];

    }


    /*
        初期位置
    */

    const positions = [

        alphabet[
            Math.floor(
                random() * 26
            )
        ],

        alphabet[
            Math.floor(
                random() * 26
            )
        ],

        alphabet[
            Math.floor(
                random() * 26
            )
        ]

    ];


    settings = {

        rotorOrder: order,

        positions: positions,

        date: date

    };


    showKey();

}


/* =========================
   KEY DISPLAY
========================= */

function showKey() {

    document.getElementById(
        "keyTable"
    ).innerHTML = `

        <table>

            <tr>
                <th>Rotor I</th>
                <th>Rotor II</th>
                <th>Rotor III</th>
            </tr>

            <tr>
                <td>
                    ${settings.rotorOrder[0]}
                </td>

                <td>
                    ${settings.rotorOrder[1]}
                </td>

                <td>
                    ${settings.rotorOrder[2]}
                </td>
            </tr>

            <tr>
                <th colspan="3">
                    Initial Position
                </th>
            </tr>

            <tr>
                <td colspan="3">
                    ${settings.positions.join(" - ")}
                </td>
            </tr>

            <tr>
                <th colspan="3">
                    Date
                </th>
            </tr>

            <tr>
                <td colspan="3">
                    ${settings.date}
                </td>
            </tr>

        </table>

    `;

}


/* =========================
   ROTOR FORWARD
========================= */

function rotorForward(
    letter,
    rotorName,
    position
) {

    const rotor =
        rotors[rotorName];

    let index =
        alphabet.indexOf(letter);


    index =
        (index + position) % 26;


    index =
        alphabet.indexOf(
            rotor[index]
        );


    index =
        (index - position + 26) % 26;


    return alphabet[index];

}


/* =========================
   ROTOR BACKWARD
========================= */

function rotorBackward(
    letter,
    rotorName,
    position
) {

    const rotor =
        rotors[rotorName];

    let index =
        alphabet.indexOf(letter);


    index =
        (index + position) % 26;


    index =
        rotor.indexOf(
            alphabet[index]
        );


    index =
        (index - position + 26) % 26;


    return alphabet[index];

}


/* =========================
   ONE CHARACTER
========================= */

function processCharacter(
    letter,
    state
) {

    /*
        ローターを進める
    */

    state[0]++;


    if (state[0] >= 26) {

        state[0] = 0;

        state[1]++;


        if (state[1] >= 26) {

            state[1] = 0;

            state[2]++;


            if (state[2] >= 26) {

                state[2] = 0;

            }

        }

    }


    let x = letter;


    /*
        Forward
    */

    x =
        rotorForward(
            x,
            settings.rotorOrder[0],
            state[0]
        );


    x =
        rotorForward(
            x,
            settings.rotorOrder[1],
            state[1]
        );


    x =
        rotorForward(
            x,
            settings.rotorOrder[2],
            state[2]
        );


    /*
        Reflector
    */

    x =
        reflector[
            alphabet.indexOf(x)
        ];


    /*
        Backward
    */

    x =
        rotorBackward(
            x,
            settings.rotorOrder[2],
            state[2]
        );


    x =
        rotorBackward(
            x,
            settings.rotorOrder[1],
            state[1]
        );


    x =
        rotorBackward(
            x,
            settings.rotorOrder[0],
            state[0]
        );


    return x;

}


/* =========================
   ENCRYPT / DECRYPT
========================= */

function transform(text) {

    let result = "";


    /*
        初期位置をコピー
    */

    let state =
        settings.positions.map(
            x =>
                alphabet.indexOf(x)
        );


    /*
        1文字ずつ処理
    */

    for (
        const char of text.toUpperCase()
    ) {

        /*
            A-Z以外はそのまま
        */

        if (
            !alphabet.includes(char)
        ) {

            result += char;

            continue;

        }


        result +=
            processCharacter(
                char,
                state
            );

    }


    return result;

}


/* =========================
   ENCRYPT
========================= */

function encrypt() {

    const text =
        document.getElementById(
            "input"
        ).value;


    document.getElementById(
        "output"
    ).textContent =
        transform(text);

}


/* =========================
   DECRYPT
========================= */

function decrypt() {

    /*
        エニグマは
        同じローター設定・
        同じ初期位置で
        同じ処理をすると
        復号できる
    */

    const text =
        document.getElementById(
            "input"
        ).value;


    document.getElementById(
        "output"
    ).textContent =
        transform(text);

}


/* =========================
   KEYBOARD
========================= */

const keyboard =
    document.getElementById(
        "keyboard"
    );


for (
    const letter of alphabet
) {

    const key =
        document.createElement(
            "div"
        );


    key.className =
        "key";


    key.textContent =
        letter;


    key.dataset.key =
        letter;


    key.onclick = () => {

        const input =
            document.getElementById(
                "input"
            );


        input.value += letter;


        flashKey(letter);

    };


    keyboard.appendChild(
        key
    );

}


/* =========================
   KEYBOARD FLASH
========================= */

function flashKey(letter) {

    const key =
        document.querySelector(
            `.key[data-key="${letter}"]`
        );


    if (!key) {
        return;
    }


    key.classList.add(
        "active"
    );


    setTimeout(() => {

        key.classList.remove(
            "active"
        );

    }, 150);

}


/* =========================
   COPY
========================= */

async function copyOutput() {

    const text =
        document.getElementById(
            "output"
        ).textContent;


    try {

        await navigator.clipboard
            .writeText(text);

        alert("COPIED!");

    } catch (error) {

        alert(
            "コピーに失敗しました"
        );

    }

}


/* =========================
   AUTOMATIC DAILY RESET
========================= */

let currentDate =
    getJapanDate();


/*
    30秒ごとに日付を確認

    日付が変わったら
    自動的に新しい鍵へ
*/

setInterval(() => {

    const newDate =
        getJapanDate();


    if (
        newDate !== currentDate
    ) {

        currentDate =
            newDate;


        generateDailyKey();


        document.getElementById(
            "output"
        ).textContent = "";


        document.getElementById(
            "input"
        ).value = "";


        alert(
            "新しい日の鍵に更新されました！"
        );

    }

}, 30000);


/* =========================
   START
========================= */

generateDailyKey();

</script>

</body>
</html>
