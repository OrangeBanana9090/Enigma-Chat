<body>

<div class="app">

<h1>🔐 ENIGMA CHAT</h1>

<div class="panel">
    <h2>Today's Key</h2>
    <div id="keyTable"></div>
</div>

<div class="panel">
    <h2>Input</h2>

    <textarea
        id="input"
        rows="4"
        placeholder="TYPE ENGLISH HERE..."
    ></textarea>

    <div class="keyboard" id="keyboard"></div>

    <button onclick="encrypt()">ENCRYPT</button>
    <button onclick="decrypt()">DECRYPT</button>
</div>

<div class="panel">
    <h2>Output</h2>
    <div id="output"></div>
</div>

<div class="panel">
    <button onclick="copyOutput()">COPY</button>
</div>

<div class="panel">

    <h2>📡 CHAT</h2>

    <input
        id="sender"
        type="text"
        placeholder="NAME"
    >

    <button onclick="sendMessage()">
        SEND ENCRYPTED MESSAGE
    </button>

    <div id="connectionStatus" class="status">
        Connecting...
    </div>

    <div id="chat"></div>

</div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
    "https://hzhtfqkzrzbjrkovvjbj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aFh3LXSz3EiPHzsLbWcZAw_ThS-iwdH";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ENIGMA CONFIG
========================= */

const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


const rotors = {

    I:
        "EKMFLGDQVZNTOWYHXUSPAIBRCJ",

    II:
        "AJDKSIRUXBLHWTMCQGZNPYFVOE",

    III:
        "BDFHJLCPRTXVZNYEIWGAKMUSQO"

};


const reflector =
    "YRUHQSLDPXNGOKMIEBFZCWVJAT";


let settings;


/* =========================
   DAILY KEY
========================= */

function getJapanDate() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());

}


function seededRandom(seed) {

    let h = 2166136261;


    for (
        let i = 0;
        i < seed.length;
        i++
    ) {

        h ^= seed.charCodeAt(i);

        h =
            Math.imul(
                h,
                16777619
            );

    }


    return function () {

        h += 0x6D2B79F5;

        let t = h;


        t =
            Math.imul(
                t ^ (t >>> 15),
                t | 1
            );


        t ^=
            t +
            Math.imul(
                t ^ (t >>> 7),
                t | 61
            );


        return (
            (
                t ^
                (t >>> 14)
            ) >>> 0
        ) / 4294967296;

    };

}


function generateDailyKey() {

    const date =
        getJapanDate();


    const random =
        seededRandom(
            "ENIGMA-CHAT-" +
            date
        );


    const rotorNames = [
        "I",
        "II",
        "III"
    ];


    const order = [
        ...rotorNames
    ];


    for (
        let i = order.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                random() *
                (i + 1)
            );


        [
            order[i],
            order[j]
        ] = [
            order[j],
            order[i]
        ];

    }


    const positions = [

        alphabet[
            Math.floor(
                random() * 26
            )
        ],

        alphabet[
            Math.floor(
                random() * 26
            )
        ],

        alphabet[
            Math.floor(
                random() * 26
            )
        ]

    ];


    settings = {

        rotorOrder: order,

        positions: positions,

        date: date

    };


    showKey();

}


/* =========================
   KEY DISPLAY
========================= */

function showKey() {

    document.getElementById(
        "keyTable"
    ).innerHTML = `

        <table>

            <tr>
                <th>Rotor I</th>
                <th>Rotor II</th>
                <th>Rotor III</th>
            </tr>

            <tr>
                <td>${settings.rotorOrder[0]}</td>
                <td>${settings.rotorOrder[1]}</td>
                <td>${settings.rotorOrder[2]}</td>
            </tr>

            <tr>
                <th colspan="3">
                    Initial Position
                </th>
            </tr>

            <tr>
                <td colspan="3">
                    ${settings.positions.join(" - ")}
                </td>
            </tr>

            <tr>
                <th colspan="3">
                    Date
                </th>
            </tr>

            <tr>
                <td colspan="3">
                    ${settings.date}
                </td>
            </tr>

        </table>

    `;

}


/* =========================
   ROTOR FORWARD
========================= */

function rotorForward(
    letter,
    rotorName,
    position
) {

    const rotor =
        rotors[rotorName];


    let index =
        alphabet.indexOf(letter);


    index =
        (index + position) % 26;


    index =
        alphabet.indexOf(
            rotor[index]
        );


    index =
        (
            index -
            position +
            26
        ) % 26;


    return alphabet[index];

}


/* =========================
   ROTOR BACKWARD
========================= */

function rotorBackward(
    letter,
    rotorName,
    position
) {

    const rotor =
        rotors[rotorName];


    let index =
        alphabet.indexOf(letter);


    index =
        (index + position) % 26;


    index =
        rotor.indexOf(
            alphabet[index]
        );


    index =
        (
            index -
            position +
            26
        ) % 26;


    return alphabet[index];

}


/* =========================
   PROCESS CHARACTER
========================= */

function processCharacter(
    letter,
    state
) {

    state[0]++;


    if (
        state[0] >= 26
    ) {

        state[0] = 0;

        state[1]++;


        if (
            state[1] >= 26
        ) {

            state[1] = 0;

            state[2]++;


            if (
                state[2] >= 26
            ) {

                state[2] = 0;

            }

        }

    }


    let x = letter;


    x =
        rotorForward(
            x,
            settings.rotorOrder[0],
            state[0]
        );


    x =
        rotorForward(
            x,
            settings.rotorOrder[1],
            state[1]
        );


    x =
        rotorForward(
            x,
            settings.rotorOrder[2],
            state[2]
        );


    x =
        reflector[
            alphabet.indexOf(x)
        ];


    x =
        rotorBackward(
            x,
            settings.rotorOrder[2],
            state[2]
        );


    x =
        rotorBackward(
            x,
            settings.rotorOrder[1],
            state[1]
        );


    x =
        rotorBackward(
            x,
            settings.rotorOrder[0],
            state[0]
        );


    return x;

}


/* =========================
   TRANSFORM
========================= */

function transform(text) {

    let result = "";


    let state =
        settings.positions.map(
            x =>
                alphabet.indexOf(x)
        );


    for (
        const char of text.toUpperCase()
    ) {

        if (
            !alphabet.includes(char)
        ) {

            result += char;

            continue;

        }


        result +=
            processCharacter(
                char,
                state
            );

    }


    return result;

}


/* =========================
   ENCRYPT
========================= */

function encrypt() {

    const text =
        document.getElementById(
            "input"
        ).value;


    document.getElementById(
        "output"
    ).textContent =
        transform(text);

}


/* =========================
   DECRYPT
========================= */

function decrypt() {

    const text =
        document.getElementById(
            "input"
        ).value;


    document.getElementById(
        "output"
    ).textContent =
        transform(text);

}


/* =========================
   KEYBOARD
========================= */

const keyboard =
    document.getElementById(
        "keyboard"
    );


for (
    const letter of alphabet
) {

    const key =
        document.createElement(
            "div"
        );


    key.className =
        "key";


    key.textContent =
        letter;


    key.dataset.key =
        letter;


    key.onclick = () => {

        const input =
            document.getElementById(
                "input"
            );


        input.value += letter;


        flashKey(letter);

    };


    keyboard.appendChild(
        key
    );

}


function flashKey(letter) {

    const key =
        document.querySelector(
            `.key[data-key="${letter}"]`
        );


    if (!key) {
        return;
    }


    key.classList.add(
        "active"
    );


    setTimeout(() => {

        key.classList.remove(
            "active"
        );

    }, 150);

}


/* =========================
   COPY
========================= */

async function copyOutput() {

    const text =
        document.getElementById(
            "output"
        ).textContent;


    if (!text) {

        alert(
            "コピーするものがないぞ()"
        );

        return;

    }


    try {

        await navigator.clipboard
            .writeText(text);


        alert("COPIED!");

    } catch (error) {

        alert(
            "コピーに失敗しました"
        );

    }

}


/* =========================
   CHAT DISPLAY
========================= */

function addChatMessage(
    sender,
    message,
    time
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    div.innerHTML = `

        <div class="sender">
            ${escapeHtml(sender)}
        </div>

        <div class="encrypted">
            ${escapeHtml(message)}
        </div>

        <div class="status">
            ${time}
        </div>

    `;


    chat.appendChild(div);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const sender =
        document.getElementById(
            "sender"
        ).value.trim() ||
        "UNKNOWN";


    const message =
        document.getElementById(
            "output"
        ).textContent;


    if (!message) {

        alert(
            "先にENCRYPTしてくれ()"
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({

                room: "main",

                sender: sender,

                message: message

            });


    if (error) {

        console.error(error);


        alert(
            "送信失敗:\n" +
            error.message
        );


        return;

    }


    document.getElementById(
        "input"
    ).value = "";


    document.getElementById(
        "output"
    ).textContent = "";

}


/* =========================
   LOAD OLD MESSAGES
========================= */

async function loadMessages() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .eq("room", "main")
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(100);


    if (error) {

        console.error(error);

        return;

    }


    document.getElementById(
        "chat"
    ).innerHTML = "";


    for (
        const message of data
    ) {

        addChatMessage(

            message.sender,

            message.message,

            new Date(
                message.created_at
            ).toLocaleTimeString()

        );

    }

}


/* =========================
   REALTIME
========================= */

const chatChannel =
    supabaseClient
        .channel(
            "enigma-chat"
        )
        .on(

            "postgres_changes",

            {

                event: "INSERT",

                schema: "public",

                table: "messages",

                filter:
                    "room=eq.main"

            },

            payload => {

                const data =
                    payload.new;


                addChatMessage(

                    data.sender,

                    data.message,

                    new Date(
                        data.created_at
                    ).toLocaleTimeString()

                );

            }

        )
        .subscribe(
            status => {

                const element =
                    document.getElementById(
                        "connectionStatus"
                    );


                if (
                    status === "SUBSCRIBED"
                ) {

                    element.textContent =
                        "● ONLINE";

                    element.className =
                        "status online";

                } else {

                    element.textContent =
                        "● " +
                        status;

                    element.className =
                        "status offline";

                }

            }
        );


/* =========================
   DAILY KEY AUTO UPDATE
========================= */

let currentDate =
    getJapanDate();


setInterval(() => {

    const newDate =
        getJapanDate();


    if (
        newDate !== currentDate
    ) {

        currentDate =
            newDate;


        generateDailyKey();


        document.getElementById(
            "output"
        ).textContent = "";


        document.getElementById(
            "input"
        ).value = "";


        alert(
            "新しい日の鍵に更新されました！"
        );

    }

}, 30000);


/* =========================
   START
========================= */

generateDailyKey();

loadMessages();

</script>

</body>
</html>
